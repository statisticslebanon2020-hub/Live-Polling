<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172554"><title>Presenter Dashboard · Live Poll</title><link rel="stylesheet" href="/styles.css"></head>
<body><section id="presenter-login" class="card" style="max-width:460px;margin:12vh auto;padding:2rem"><header class="dash-header"><div><div class="brand"><span class="brand-mark">P</span><span>LIVE POLL</span></div><p class="eyebrow">PRESENTER ACCESS</p></div><img class="header-logo" src="/statistics-lebanon-logo.jpeg" alt="Statistics Lebanon Polling & Research"/></header><form id="login-form"><label for="presenter-key">Presenter key</label><input id="presenter-key" type="password" autocomplete="current-password" required style="display:block;width:100%;margin:0.75rem 0;padding:0.8rem"><button class="button primary" type="submit">Continue</button><p id="login-message" class="muted" role="alert"></p></form></section><main id="dashboard" class="dashboard" hidden><header class="dash-header report-header"><div><div class="brand"><span class="brand-mark">P</span><span>LIVE POLL</span></div><p class="eyebrow">PRESENTER DASHBOARD</p></div><div class="report-tools"><img class="header-logo" src="/statistics-lebanon-logo.jpeg" alt="Statistics Lebanon Polling & Research"/><button id="fullscreen-toggle" class="button secondary" type="button" aria-label="Enter full screen">Full screen</button></div></header><div id="notice" class="notice" hidden></div><section class="dash-grid"><aside class="card qr-card"><p class="eyebrow">JOIN THE POLL</p><img id="qr" alt="QR code for respondents"/><a id="respondent-link" target="_blank" rel="noreferrer"></a></aside><section class="card live-card"><div class="live-heading"><div><p class="eyebrow" id="progress">QUESTION 1</p><h1 id="question">Loading question…</h1></div></div><div id="results" class="results"></div><p id="total" class="muted"></p><p id="updated" class="updated" aria-live="polite"></p><div class="controls"><button class="button secondary" data-action="previous">← Previous</button><button class="button secondary" data-action="next">Next →</button></div></section></section></main><script src="/socket.io/socket.io.js"></script><script src="/dashboard.js?v=3"></script></body></html>
